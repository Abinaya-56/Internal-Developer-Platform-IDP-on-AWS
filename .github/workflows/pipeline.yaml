name: IDP Platform Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
          --build-arg BUILD_TIME="$(date)" \
          -t ghcr.io/${{ github.repository_owner }}/idp-demo:latest \
          ./apps/demo-app

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/idp-demo:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/platform/deployment.yaml
          kubectl apply -f k8s/platform/service.yaml
          kubectl apply -f k8s/platform/ingress.yaml
