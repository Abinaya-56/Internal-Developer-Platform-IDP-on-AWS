name: IDP Pipeline

on:
  push:
    branches:
      - main
      - stage

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set environment from branch
      id: vars
      run: |
        if [ "${{ github.ref_name }}" = "stage" ]; then
          echo "environment=stage" >> "$GITHUB_OUTPUT"
        else
          echo "environment=dev" >> "$GITHUB_OUTPUT"
        fi
        echo "sha_tag=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "$GITHUB_OUTPUT"
        echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/idp-demo" >> "$GITHUB_OUTPUT"

    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build image
      run: |
        docker build \
          --build-arg BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          -t ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_tag }} \
          -t ${{ steps.vars.outputs.image }}:latest \
          ./apps/demo-app

    - name: Push image
      run: |
        docker push ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_tag }}
        docker push ${{ steps.vars.outputs.image }}:latest

    - name: Setup kubectl
      if: ${{ secrets.KUBE_CONFIG != '' }}
      uses: azure/setup-kubectl@v3

    - name: Setup Helm
      if: ${{ secrets.KUBE_CONFIG != '' }}
      uses: azure/setup-helm@v4

    - name: Configure kubeconfig
      if: ${{ secrets.KUBE_CONFIG != '' }}
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $RUNNER_TEMP/kubeconfig
        echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

    - name: Verify cluster connectivity
      if: ${{ secrets.KUBE_CONFIG != '' }}
      run: kubectl cluster-info

    - name: Apply namespaces and RBAC
      if: ${{ secrets.KUBE_CONFIG != '' }}
      run: kubectl apply -f k8s/platform/namespace.yaml -f k8s/platform/rbac.yaml

    - name: Deploy with Helm
      if: ${{ secrets.KUBE_CONFIG != '' }}
      run: |
        helm upgrade --install idp-demo ./infra/helm/idp-demo \
          -n ${{ steps.vars.outputs.environment }} \
          -f infra/helm/idp-demo/values-${{ steps.vars.outputs.environment }}.yaml \
          --set image.repository=${{ steps.vars.outputs.image }} \
          --set image.tag=${{ steps.vars.outputs.sha_tag }} \
          --wait --timeout 120s

    - name: Verify rollout
      if: ${{ secrets.KUBE_CONFIG != '' }}
      run: |
        kubectl rollout status deployment/idp-demo -n ${{ steps.vars.outputs.environment }} --timeout=120s

    - name: No cluster configured
      if: ${{ secrets.KUBE_CONFIG == '' }}
      run: |
        echo "## No cluster configured" >> "$GITHUB_STEP_SUMMARY"
        echo "Image built and pushed to GHCR successfully. Kubernetes deploy steps were skipped because the KUBE_CONFIG secret isn't set." >> "$GITHUB_STEP_SUMMARY"
        echo "Set the KUBE_CONFIG secret (base64-encoded kubeconfig) in repo Settings > Secrets and variables > Actions to enable live deployment." >> "$GITHUB_STEP_SUMMARY"