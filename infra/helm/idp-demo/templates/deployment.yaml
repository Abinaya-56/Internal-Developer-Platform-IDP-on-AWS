apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idp-demo.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "idp-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app: {{ include "idp-demo.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "idp-demo.fullname" . }}
    spec:
      serviceAccountName: {{ include "idp-demo.serviceAccountName" . }}
      containers:
        - name: {{ include "idp-demo.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
        {{- if .Values.metrics.enabled }}
        - name: nginx-exporter
          image: "{{ .Values.metrics.exporterImage }}"
          args:
            - "-nginx.scrape-uri=http://localhost:{{ .Values.service.targetPort }}/stub_status"
          ports:
            - containerPort: {{ .Values.metrics.exporterPort }}
              name: metrics
        {{- end }}
