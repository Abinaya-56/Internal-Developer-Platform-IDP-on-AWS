apiVersion: v1
kind: Service
metadata:
  name: {{ include "idp-demo.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "idp-demo.labels" . | nindent 4 }}
  {{- if .Values.metrics.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.metrics.exporterPort }}"
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "idp-demo.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.exporterPort }}
      targetPort: {{ .Values.metrics.exporterPort }}
    {{- end }}
